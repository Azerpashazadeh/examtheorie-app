name: Add Clarity Tracking Code

on:
  workflow_dispatch:

jobs:
  add-clarity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Add Clarity script to all HTML files
        run: |
          python3 - <<'EOF'
          import os
          import glob

          CLARITY_SCRIPT = """<!-- Microsoft Clarity -->
          <script type="text/javascript">
              (function(c,l,a,r,i,t,y){
                  c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                  t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
                  y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
              })(window, document, "clarity", "script", "vz9ccypxk4");
          </script>"""

          MARKER = "vz9ccypxk4"

          html_files = glob.glob("**/*.html", recursive=True)
          updated = 0
          skipped = 0

          for filepath in html_files:
              with open(filepath, "r", encoding="utf-8") as f:
                  content = f.read()

              if MARKER in content:
                  print(f"SKIP (already has Clarity): {filepath}")
                  skipped += 1
                  continue

              if "</head>" in content:
                  new_content = content.replace("</head>", f"{CLARITY_SCRIPT}\n</head>", 1)
              elif "<body" in content:
                  idx = content.find("<body")
                  idx = content.find(">", idx) + 1
                  new_content = content[:idx] + f"\n{CLARITY_SCRIPT}" + content[idx:]
              else:
                  print(f"SKIP (no <head> or <body>): {filepath}")
                  skipped += 1
                  continue

              with open(filepath, "w", encoding="utf-8") as f:
                  f.write(new_content)

              print(f"UPDATED: {filepath}")
              updated += 1

          print(f"\n✅ Done! Updated: {updated} | Skipped: {skipped} | Total: {len(html_files)}")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Add Microsoft Clarity tracking to all HTML files"
          git push