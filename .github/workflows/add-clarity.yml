name: Add Clarity Tracking Code

on:
  workflow_dispatch:

jobs:
  add-clarity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Add Clarity script to all HTML files
        run: python3 scripts/add_clarity.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Add Microsoft Clarity tracking to all HTML files"
          git push
