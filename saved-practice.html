<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ExamTheorie · Zorlandığım Sorular</title>
  <script>
    (function () {
      var SUPPORTED = ['en', 'nl', 'tr', 'ar', 'ru', 'fa', 'es'];
      var qs = new URLSearchParams(window.location.search);
      var raw = String(qs.get('lang') || localStorage.getItem('et_lang') || 'en').toLowerCase().split('-')[0];
      var lang = SUPPORTED.indexOf(raw) >= 0 ? raw : 'en';
      window.__PRACTICE_LANG = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = (lang === 'ar' || lang === 'fa') ? 'rtl' : 'ltr';
    })();
  </script>
  <link rel="preconnect" href="https://azerpashazadeh.github.io" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --blue: #0061ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(920px 520px at 8% -10%, rgba(0,97,255,.11), transparent 62%),
        radial-gradient(860px 480px at 95% 4%, rgba(245,158,11,.10), transparent 60%),
        linear-gradient(180deg, #f8fafc 0%, #eef4fb 100%);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .5; }
    .hidden, [hidden] { display: none !important; }

    .exam-app {
      position: relative;
      max-width: 1460px;
      margin: auto;
      padding: 24px 36px 20px;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 4px 18px;
    }
    .wordmark {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: Outfit, Inter, sans-serif;
      font-weight: 800;
      font-size: 26px;
      letter-spacing: -.6px;
      color: #0f172a;
      text-decoration: none;
    }
    .wordmark > svg { width: 32px; height: 32px; color: #0061ff; flex-shrink: 0; }
    .wordmark small {
      display: block;
      font-family: Inter, sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0;
      color: #64748b;
    }
    .page-tools { display: flex; align-items: center; gap: 10px; }
    .exam-label {
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #b45309;
      background: #fffbeb;
      border: 1px solid #fde68a;
      padding: 6px 13px;
      border-radius: 999px;
      font-weight: 800;
    }
    .close-top-btn {
      height: 38px;
      padding: 0 14px;
      border-radius: 11px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      font-weight: 700;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 10px rgba(15,23,42,.05);
    }
    .close-top-btn:hover { border-color: #94a3b8; background: #f8fafc; }
    .fs-top-btn {
      height: 38px; width: 38px; border-radius: 11px; border: 1px solid #cbd5e1;
      background: #ffffff; color: #334155; display: inline-grid; place-items: center;
      box-shadow: 0 3px 10px rgba(15,23,42,.05); padding: 0;
    }
    .fs-top-btn:hover { border-color: #0061ff; color: #0061ff; background: #f8fbff; }
    .fs-top-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; }
    .fs-top-btn:not(.on) .icon-fs-leave, .fs-top-btn.on .icon-fs-enter { display: none; }
    .question-image, .image-wrapper img, .drag-drop-container img {
      -webkit-user-drag: none; user-select: none; -webkit-touch-callout: none;
      touch-action: pan-y pinch-zoom !important;
    }
    .drag-drop-container img { pointer-events: none; }
    html .questionS3.has-drag-drop > .drag-drop-container { touch-action: pan-y pinch-zoom !important; }
    .drag-drop-container .box { touch-action: none !important; }

    .exam-shell {
      background: #ffffff;
      border: 1.5px solid #c5d6ec;
      border-radius: 24px;
      box-shadow: 0 26px 65px rgba(15,23,42,.09), 0 0 0 1px rgba(0,97,255,.04);
      overflow: clip;
    }
    .exam-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 58px;
      padding: 10px 28px;
      border-bottom: 1px solid #e2e8f0;
      background: rgba(248,250,252,.92);
    }
    .toolbar-brand {
      font-family: Outfit, Inter, sans-serif;
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .toolbar-star { color: #f59e0b; font-size: 20px; line-height: 1; }
    .progress-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    #soruNumarasiS3 {
      font-size: 12.5px;
      font-weight: 700;
      margin: 0;
      color: #1e293b;
      white-space: nowrap;
    }
    .progress-track {
      height: 7px;
      width: 140px;
      background: #e2e8f0;
      border-radius: 9px;
      overflow: hidden;
    }
    #progress-fill {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #f59e0b, #0061ff);
      transition: width .2s;
    }
    #progress-percent { font-size: 12px; font-weight: 700; color: #475569; min-width: 32px; }

    .exam-content { padding: 22px 28px; }

    /* Mode chooser & Empty / Loading / Summary states */
    .state-card {
      max-width: 660px;
      margin: 28px auto;
      text-align: center;
      padding: 18px 12px;
    }
    .state-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #b45309;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .state-card h1 {
      font-family: Outfit, Inter, sans-serif;
      font-size: clamp(26px, 3.2vw, 38px);
      line-height: 1.18;
      margin: 0 0 12px;
      color: #0f172a;
    }
    .state-card p {
      color: #475569;
      font-size: 15.5px;
      line-height: 1.65;
      margin: 0 auto 24px;
      max-width: 520px;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .btn-primary {
      border: 0;
      border-radius: 13px;
      padding: 13px 24px;
      background: linear-gradient(135deg, #0061ff, #0095ff);
      color: #ffffff;
      font-weight: 700;
      font-size: 14.5px;
      box-shadow: 0 8px 20px rgba(0,97,255,.24);
    }
    .btn-secondary {
      border: 1.5px solid #cbd5e1;
      border-radius: 13px;
      padding: 12px 20px;
      background: #ffffff;
      color: #1e293b;
      font-weight: 700;
      font-size: 14px;
    }
    .btn-secondary:hover { border-color: #0061ff; color: #0061ff; background: #f8fbff; }
    .btn-amber {
      border: 1.5px solid #f59e0b;
      border-radius: 13px;
      padding: 12px 20px;
      background: #fffbeb;
      color: #92400e;
      font-weight: 700;
      font-size: 14px;
    }

    /* Question Grid Layout (matches test-*.html & exam-tts.js selectors) */
    .quiz-container-s3:empty { display: none; }
    .questionS3 {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.16fr) minmax(0, .94fr);
      grid-template-rows: auto 1fr;
      column-gap: 26px;
      row-gap: 16px;
      align-items: start;
      isolation: isolate;
      min-width: 0;
    }
    .questionS3::before {
      content: "";
      position: absolute;
      inset: 0 0 0 calc(55.24% + 13px);
      background: linear-gradient(135deg, #f8fafc, #eff6ff);
      border: 1.5px solid #cbe0f8;
      box-shadow: 0 6px 20px rgba(0,97,255,.05);
      border-radius: 20px;
      z-index: -1;
    }
    html[dir="rtl"] .questionS3::before {
      inset: 0 calc(55.24% + 13px) 0 0;
    }
    .questionS3 > p {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      gap: 13px;
      align-items: flex-start;
      font-family: Outfit, Inter, sans-serif;
      font-size: clamp(16.5px, 1.3vw, 20.5px);
      font-weight: 700;
      line-height: 1.4;
      padding: 22px 22px 0;
      margin: 0;
      min-width: 0;
      color: #0f172a;
    }
    .questionS3 > p::before {
      content: attr(data-number);
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      background: #eff6ff;
      color: #0061ff;
      border: 1px solid rgba(0,97,255,.24);
      border-radius: 12px;
      font-size: 17px;
      line-height: 1;
    }
    .questionS3 > .question-image,
    .questionS3 > .question-video {
      grid-column: 1;
      grid-row: 1 / span 3;
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      border-radius: 15px;
      border: 1.5px solid #d8e4f2;
      box-shadow: 0 10px 24px rgba(22,44,71,.07);
    }
    .questionS3 > .answers {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      gap: 11px;
      min-width: 0;
      padding: 0 22px 22px;
    }
    .questionS3.no-media {
      max-width: 790px;
      margin: auto;
      grid-template-columns: 1fr;
    }
    .questionS3.no-media::before { inset: 0; }
    .questionS3.no-media > p,
    .questionS3.no-media > .answers { grid-column: 1; }

    .cevapSecenegi-s3 {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 13px 16px;
      background: #ffffff;
      border: 1.5px solid #d1dceb;
      border-radius: 12px;
      color: #1e293b;
      line-height: 1.42;
      font-size: 14.5px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .cevapSecenegi-s3:hover { border-color: #0061ff; background: #f8fbff; }
    .cevapSecenegi-s3.selectedAnswer {
      border-color: #0061ff !important;
      background: #eff6ff !important;
      box-shadow: 0 0 0 2px rgba(0,97,255,.14);
    }
    .cevapSecenegi-s3.selected-correct {
      background: #ecfdf5 !important;
      border-color: #22c55e !important;
      color: #166534 !important;
    }
    .cevapSecenegi-s3.selected-wrong {
      background: #fef2f2 !important;
      border-color: #ef4444 !important;
      color: #991b1b !important;
    }
    .cevapSecenegi-s3 input {
      appearance: auto;
      width: 19px;
      height: 19px;
      margin: 0;
      flex-shrink: 0;
      accent-color: #0061ff;
    }
    .answer-input {
      width: 100%;
      max-width: 260px;
      min-height: 56px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px 16px;
      background: #ffffff;
      color: #0f172a;
      font-size: 21px;
      font-weight: 700;
    }
    .answer-input:focus { border-color: #0061ff; outline: none; box-shadow: 0 0 0 3px rgba(0,97,255,.14); }

    /* Image choices */
    .questionS3.has-image-choices { min-height: 0; }
    .questionS3 > .image-container {
      grid-column: 1;
      grid-row: 1 / span 3;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      width: 100%;
      max-width: var(--choice-width, 554px);
      justify-self: center;
      align-self: start;
      min-width: 0;
    }
    .image-wrapper {
      position: relative;
      border-radius: 13px;
      overflow: hidden;
      border: 2.5px solid transparent;
      background: #f1f6fc;
      cursor: pointer;
    }
    .image-wrapper img { display: block; width: 100%; height: auto; object-fit: contain; }
    .image-wrapper.selected { border-color: #0061ff; box-shadow: 0 0 0 2px rgba(0,97,255,.16); }
    .image-wrapper.selected::after {
      content: "✓";
      position: absolute;
      right: 8px;
      top: 8px;
      display: grid;
      place-items: center;
      background: #0061ff;
      color: #fff;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-weight: 700;
      pointer-events: none;
    }
    .image-wrapper.is-correct-img { border-color: #22c55e !important; box-shadow: 0 0 0 3px rgba(34,197,94,.22); }
    .image-wrapper.is-wrong-img { border-color: #ef4444 !important; box-shadow: 0 0 0 3px rgba(239,68,68,.22); }
    .img-badge {
      position: absolute;
      left: 8px;
      top: 8px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
      color: #fff;
      z-index: 3;
    }
    .img-badge.ok { background: #16a34a; }
    .img-badge.bad { background: #dc2626; }

    /* Drag & Drop */
    .questionS3.has-drag-drop { min-height: 0; }
    html .questionS3.has-drag-drop > .drag-drop-container {
      grid-column: 1;
      grid-row: 1 / span 3;
      align-self: start;
      justify-self: center;
      position: relative;
      width: 100% !important;
      max-width: var(--dd-width, 100%);
      height: auto;
      padding: 0;
      touch-action: none;
    }
    .drag-drop-container img { display: block; width: 100%; height: auto; border-radius: 15px; }
    .box, .target {
      position: absolute;
      width: 12%;
      height: 14.9%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: clamp(14px, min(2vw, 2.5vh), 26px);
      font-weight: 800;
      line-height: 1;
    }
    .box {
      cursor: grab;
      color: #bd7400;
      background: #ffffff;
      border: 4px solid #f59e0b;
      box-shadow: 0 3px 12px rgba(0,0,0,.25);
      z-index: 2;
      touch-action: none;
    }
    .target { color: #0f172a; background: transparent; }
    .target.highlight { background: rgba(255,198,111,.55); border: 2px dashed #d97706; }
    .target.show-correct-hint {
      background: rgba(34,197,94,.88);
      color: #ffffff;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 12px rgba(22,163,74,.35);
      z-index: 3;
    }

    /* Practice Action Row inside question */
    .practice-tools-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }
    .check-answer-btn {
      border: 0;
      border-radius: 11px;
      padding: 10px 16px;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
      font-weight: 700;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .check-answer-btn:hover { background: linear-gradient(135deg, #0061ff, #0084ff); }
    .mastered-btn {
      border: 1.5px solid #cbd5e1;
      border-radius: 11px;
      padding: 9px 13px;
      background: #ffffff;
      color: #475569;
      font-weight: 700;
      font-size: 12.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .mastered-btn:hover { border-color: #16a34a; color: #15803d; background: #f0fdf4; }
    .mastered-btn.is-removed {
      border-color: #16a34a;
      background: #ecfdf5;
      color: #15803d;
    }

    /* Feedback Explanation Box */
    .feedback-container {
      width: 100%;
      border-radius: 13px;
      padding: 14px 16px;
      margin-top: 6px;
      border: 2px solid #cbd5e1;
      background: #ffffff;
    }
    .feedback-container.fb-correct { border-color: #22c55e; background: #f4fcf7; }
    .feedback-container.fb-wrong { border-color: #ef4444; background: #fff6f6; }
    .feedback-status {
      font-weight: 800;
      font-size: 13.5px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .fb-correct .feedback-status { color: #15803d; }
    .fb-wrong .feedback-status { color: #dc2626; }
    .feedback-text {
      font-size: 13.8px;
      line-height: 1.62;
      color: #1e293b;
    }

    /* Bottom Bar */
    .exam-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 28px;
      border-top: 1px solid #e2e8f0;
      background: rgba(248,250,252,.92);
    }
    .nav-hint { font-size: 12.5px; color: #64748b; font-weight: 500; }
    .question-navigation { display: flex; align-items: center; gap: 10px; }
    .nav-btn {
      border-radius: 12px;
      min-width: 132px;
      height: 46px;
      padding: 0 18px;
      font-size: 14.5px;
      font-weight: 700;
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .nav-btn.primary {
      border: 0;
      color: #ffffff;
      background: linear-gradient(135deg, #0061ff, #0095ff);
      box-shadow: 0 6px 16px rgba(0,97,255,.25);
    }

    /* Summary Grid */
    .summary-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 18px auto 24px;
      max-width: 600px;
    }
    .sum-cell {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      font-weight: 700;
      font-size: 14px;
      display: grid;
      place-items: center;
    }
    .sum-cell.ok { background: #dcfce7; border-color: #22c55e; color: #166534; }
    .sum-cell.bad { background: #fee2e2; border-color: #ef4444; color: #991b1b; }

    /* Stable desktop viewport fit (including 52x29 16:9 widescreen) */
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    .exam-app { height: 100vh; height: var(--sp-vh, 100dvh); display: flex; flex-direction: column; overflow: hidden; }
    .page-header { flex: none; }
    .exam-shell { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .exam-toolbar, .exam-actions { flex: none; }
    .exam-content { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; scrollbar-gutter: stable; }
    @media (min-width: 721px) and (max-height: 1090px) {
      .exam-app { padding-top: clamp(8px, 1.5vh, 22px); padding-bottom: clamp(8px, 1.2vh, 16px); }
      .page-header { margin-bottom: clamp(6px, 1.2vh, 16px); }
      .exam-toolbar { min-height: clamp(46px, 5.8vh, 56px); padding-top: 6px; padding-bottom: 6px; }
      .exam-content { padding-top: clamp(10px, 1.6vh, 20px); padding-bottom: clamp(10px, 1.6vh, 20px); }
      .exam-actions { padding-top: clamp(9px, 1.4vh, 15px); padding-bottom: clamp(9px, 1.4vh, 15px); }
    }
    @media (max-width: 960px) {
      .exam-app { padding: 14px 12px 18px; }
      .exam-label { display: none; }
      .exam-toolbar { padding: 8px 14px; }
      .toolbar-brand { font-size: 15.5px; }
      .progress-track { width: 80px; }
      .exam-content { padding: 14px; }
      .questionS3 { display: flex; flex-direction: column; gap: 0; }
      .questionS3::before { display: none; }
      .questionS3 > p { order: 0; padding: 0 0 14px; font-size: 16px; width: 100%; }
      .questionS3 > .question-image,
      .questionS3 > .question-video,
      .questionS3 > .image-container,
      html .questionS3.has-drag-drop > .drag-drop-container {
        order: 1;
        width: 100% !important;
        max-width: none !important;
        margin-bottom: 14px;
      }
      .questionS3 > .answers { order: 2; padding: 0; width: 100%; }
      .exam-actions { flex-wrap: wrap; padding: 12px 14px; }
      .nav-hint { display: none !important; }
      .question-navigation { width: 100%; display: grid; grid-template-columns: 1fr 1fr; order: 0; }
      .nav-btn { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="exam-app">
    <header class="page-header">
      <a class="wordmark" id="homeLink" href="/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4h8l-3 8H5zm13 0h8l-3 8h-8zM4 16h8l-3 8H1zm13 0h8l-3 8h-8z" fill="currentColor"></path></svg>
        <div>ExamTheorie<small id="brandSub"></small></div>
      </a>
      <div class="page-tools">
        <span class="exam-label" id="topBadge"></span>

    function shuffleCopy(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a;
    }

      var folderMap = { en: 'englishjsons', nl: 'dutchjsons', tr: 'turkishjsons', ar: 'arabicjsons' };
      if (folderMap[lang]) {
        return 'https://azerpashazadeh.github.io/sorularveresimler/test' + contentTest + '/' + folderMap[lang] + '/test' + contentTest + '-' + fileType + lang + '.json';

    function fitImageChoices(qEl) {
      var grid = qEl.querySelector(':scope > .image-container');
      if (!grid) return;
      if (mobileLayout.matches) {
        grid.style.removeProperty('--choice-width');
        return;
      }
      var cs = getComputedStyle(examContent);
      var gs = getComputedStyle(grid);
      var gap = parseFloat(gs.columnGap) || 14;
      var rows = Math.ceil(grid.children.length / 2) || 2;
      var room = examContent.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      var h = Math.max(115, Math.min(180, (room - (rows - 1) * gap - 8) / rows));
      var w = Math.floor(2 * h * 1.5 + gap) + 'px';
      grid.style.setProperty('--choice-width', w);
    }

    function fitDragDrop(qEl) {
      var dd = qEl.querySelector(':scope > .drag-drop-container');
      if (!dd) return;
      if (mobileLayout.matches) {
        dd.style.removeProperty('--dd-width');
        return;
      }
      var img = dd.querySelector('img');
      if (img && !img.complete && !img.dataset.ddFitBound) {
        img.dataset.ddFitBound = '1';
        img.addEventListener('load', function () { fitDragDrop(qEl); }, { once: true });
      }
      var ratio = (img && img.naturalWidth > 0 && img.naturalHeight > 0)
        ? (img.naturalWidth / img.naturalHeight)
        : (1400 / 1125);
      var bottomFactor = 1;
      dd.querySelectorAll('.box, .target').forEach(function (el) {
        var topPct = parseFloat(el.style.top);
        if (Number.isFinite(topPct)) bottomFactor = Math.max(bottomFactor, (topPct + 15.4) / 100);
      });
      var cs = getComputedStyle(examContent);
      var room = examContent.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      var maxH = Math.max(240, (room - 10) / bottomFactor);
      var maxW = Math.floor(maxH * ratio) + 'px';
      if (dd.style.getPropertyValue('--dd-width') !== maxW) {
        dd.style.setProperty('--dd-width', maxW);
        if (typeof window.Draggable !== 'undefined') {
          requestAnimationFrame(function () {
            dd.querySelectorAll('.box').forEach(function (box) {
              var inst = window.Draggable.get(box);
              if (inst && typeof inst.applyBounds === 'function') inst.applyBounds(dd);
            });
          });
        }
      }
    }

    function evaluateItem(item, qEl) {
      var q = item.q;
      if (item.fileType === 'radio') {
        var sel = qEl.querySelector('input[type="radio"]:checked');
        var val = sel ? sel.value : '';
        return { answered: Boolean(val), isCorrect: val === String(q.dogruCevap) };
      }
      if (item.fileType === 'fillblank') {
        var inp = qEl.querySelector('.answer-input');
        var v = inp ? inp.value.trim() : '';
        return { answered: v.length > 0, isCorrect: v === String(q.dogruCevap).trim() };
      }
      if (item.fileType === 'checkbox') {
        var checked = Array.from(qEl.querySelectorAll('input[type="checkbox"]:checked')).map(function (c) { return c.value; }).sort();
        var expected = (Array.isArray(q.dogruCevap) ? q.dogruCevap.slice() : [q.dogruCevap]).map(String).sort();
        var ok = checked.length === expected.length && checked.every(function (x, i) { return x === expected[i]; });
        return { answered: checked.length > 0, isCorrect: ok };
      }
      if (item.fileType === 'resimsech') {
        var chosen = Array.from(qEl.querySelectorAll('.image-wrapper.selected img')).map(function (im) { return im.getAttribute('data-raw-src') || im.src; }).sort();
        var exp = (Array.isArray(q.dogruCevap) ? q.dogruCevap.slice() : [q.dogruCevap]).map(String).sort();
        var okImg = chosen.length === exp.length && chosen.every(function (x, i) { return x === exp[i]; });
        return { answered: chosen.length > 0, isCorrect: okImg };
      }
      if (item.fileType === 'dragdrop') {
        var boxes = Array.from(qEl.querySelectorAll('.drag-drop-container .box'));
        var pairs = Array.isArray(q.dogruCevap) ? q.dogruCevap : [];
        var placedCount = boxes.filter(function (b) { return Boolean(b.dataset.placedTarget); }).length;
        var okDd = pairs.length > 0 && pairs.every(function (pair) {
          var b = boxes.find(function (el) { return el.dataset.draggerId === pair.id; });
          return b && b.dataset.placedTarget === pair.target;
        });
        return { answered: placedCount > 0, isCorrect: okDd };
      }
      return { answered: false, isCorrect: false };
    }

    function revealFeedbackOnQuestion(item, qEl) {
      var res = evaluateItem(item, qEl);
      item.checked = true;
      item.isCorrect = res.isCorrect;
      var q = item.q;

      // Visual markings per type
      if (item.fileType === 'radio' || item.fileType === 'checkbox') {
        var corrArr = Array.isArray(q.dogruCevap) ? q.dogruCevap.map(String) : [String(q.dogruCevap)];
        qEl.querySelectorAll('.cevapSecenegi-s3').forEach(function (lbl) {
          lbl.classList.remove('selected-correct', 'selected-wrong');
          var inp = lbl.querySelector('input');
          if (!inp) return;
          if (corrArr.indexOf(inp.value) >= 0) {
            lbl.classList.add('selected-correct');
          } else if (inp.checked) {
            lbl.classList.add('selected-wrong');
          }
        });
      } else if (item.fileType === 'fillblank') {
        var inp = qEl.querySelector('.answer-input');
        if (inp) {
          inp.style.borderColor = res.isCorrect ? '#22c55e' : '#ef4444';
          inp.style.background = res.isCorrect ? '#ecfdf5' : '#fef2f2';
        }
      } else if (item.fileType === 'resimsech') {
        var expImgs = Array.isArray(q.dogruCevap) ? q.dogruCevap.map(String) : [String(q.dogruCevap)];
        qEl.querySelectorAll('.image-wrapper').forEach(function (wrap) {
          wrap.classList.remove('is-correct-img', 'is-wrong-img');
          var oldB = wrap.querySelector('.img-badge');
          if (oldB) oldB.remove();
          var im = wrap.querySelector('img');
          var raw = im ? im.getAttribute('data-raw-src') : '';
          var shouldSelect = expImgs.indexOf(raw) >= 0;
          if (shouldSelect) {
            wrap.classList.add('is-correct-img');
            var bOk = document.createElement('span');
            bOk.className = 'img-badge ok';
            bOk.textContent = '✓';
            wrap.appendChild(bOk);
          } else if (wrap.classList.contains('selected')) {
            wrap.classList.add('is-wrong-img');
            var bBad = document.createElement('span');
            bBad.className = 'img-badge bad';
            bBad.textContent = '✕';
            wrap.appendChild(bBad);
          }
        });
      } else if (item.fileType === 'dragdrop') {
        var pairs = Array.isArray(q.dogruCevap) ? q.dogruCevap : [];
        qEl.querySelectorAll('.drag-drop-container .box').forEach(function (box) {
          var expectedPair = pairs.find(function (p) { return p.id === box.dataset.draggerId; });
          var okBox = expectedPair && box.dataset.placedTarget === expectedPair.target;
          box.style.backgroundColor = okBox ? '#16a34a' : '#ef4444';
          box.style.borderColor = '#ffffff';
          box.style.color = '#ffffff';
        });
        if (!res.isCorrect) {
          qEl.querySelectorAll('.drag-drop-container .target').forEach(function (tEl) {
            var p = pairs.find(function (pr) { return pr.target === tEl.dataset.logicalTarget; });
            if (p) {
              var num = p.id.replace('dragger', '');
              tEl.textContent = num;
              tEl.classList.add('show-correct-hint');
            }
          });
        }
      }

      // Explanation box (.feedback-container -> auto-enhanced by exam-tts.js!)
      var answersDiv = qEl.querySelector(':scope > .answers');
      var existingFb = qEl.querySelector('.feedback-container');
      if (existingFb) existingFb.remove();

      var fb = document.createElement('div');
      fb.id = 'fb-saved-' + item.idx;
      fb.className = 'feedback-container ' + (res.isCorrect ? 'fb-correct' : 'fb-wrong');

      var st = document.createElement('div');
      st.className = 'feedback-status';
      st.textContent = res.isCorrect ? T.checkedOk : T.checkedBad;
      fb.appendChild(st);

      var txt = document.createElement('div');
      txt.className = 'feedback-text';
      var explanation = (q.feedback && q.feedback.metin) ? q.feedback.metin : '';
      if (item.fileType === 'fillblank' && !res.isCorrect && q.dogruCevap) {
        explanation = T.correctAnsLabel + q.dogruCevap + (explanation ? ' — ' + explanation : '');
      }
      txt.textContent = explanation;
      fb.appendChild(txt);

      answersDiv.appendChild(fb);
    }

    async function toggleRemoveMastered(item, btn) {
      if (btn.disabled) return;
      btn.disabled = true;
      try {
        if (!item.removedFromDb) {
          var del = await sb
            .from('user_saved_questions')
            .delete()
            .eq('user_id', currentUser.id)
            .eq('language', lang)
            .eq('content_test', item.contentTest)
            .eq('file_type', item.fileType)
            .eq('question_numara', item.numara);
          if (!del.error) {
            item.removedFromDb = true;
            btn.classList.add('is-removed');
            btn.textContent = T.masterDone;
            notifyOpener();
          }
        } else {
          var ins = await sb
            .from('user_saved_questions')
            .upsert({
              user_id: currentUser.id,
              language: lang,
              content_test: item.contentTest,
              file_type: item.fileType,
              question_numara: item.numara,
              source_test: item.sourceTest
            }, { onConflict: 'user_id,language,content_test,file_type,question_numara' });
          if (!ins.error) {
            item.removedFromDb = false;
            btn.classList.remove('is-removed');
            btn.textContent = T.masterBtn;
            notifyOpener();
          }
        }
      } finally {
        btn.disabled = false;
      }
    }

    function initDragDropForQuestion(item, qEl, oneBasedIdx) {
      var dd = qEl.querySelector('#demo-' + oneBasedIdx);
      if (!dd) return;
      var q = item.q;
      dd.innerHTML = '';

      (q.elements || []).forEach(function (el, eIdx) {
        var div = document.createElement('div');
        div.className = el.type + ' ' + (el.class || '');
        div.id = el.type + '-' + oneBasedIdx + '-' + eIdx;
        div.style.top = el.position.top;
        div.style.left = el.position.left;
        div.textContent = el.value || '';
        if (el.type === 'box') {
          div.dataset.draggerId = el.class || ('dragger' + (eIdx + 1));
          div.dataset.placedTarget = '';
        } else {
          div.dataset.logicalTarget = el.id || '';
        }
        dd.appendChild(div);
      });

      if (q.resim) {
        var img = document.createElement('img');
        img.src = q.resim;
        img.alt = 'Question';
        img.decoding = 'async';
        dd.appendChild(img);
      }

      var setupDraggable = function () {
        var draggers = dd.querySelectorAll('.box');
        var targets = dd.querySelectorAll('.target');
        draggers.forEach(function (d) {
          d.originalLeft = d.style.left;
          d.originalTop = d.style.top;
          d.targetAttachedTo = null;
        });
        if (typeof window.Draggable === 'undefined') return;
        window.Draggable.create(draggers, {
          bounds: dd,
          edgeResistance: 0.1,
          inertia: false,
          onDragStart: function () {
            window.gsap.killTweensOf(this.target);
            targets.forEach(function (t) {
              t.classList.add('highlight');
              t.classList.remove('show-correct-hint');
            });
          },
          onDragEnd: function () {
            var dragger = this.target;
            var self = this;
            var dRect = dragger.getBoundingClientRect();
            var dCx = dRect.left + dRect.width / 2;
            var dCy = dRect.top + dRect.height / 2;
            var bestTarget = null;
            var bestDist = Infinity;
            targets.forEach(function (target) {
              target.classList.remove('highlight');
              if (target.classList.contains('occupied') && dragger.targetAttachedTo !== target) return;
              var tRect = target.getBoundingClientRect();
              var tCx = tRect.left + tRect.width / 2;
              var tCy = tRect.top + tRect.height / 2;
              var dist = Math.hypot(dCx - tCx, dCy - tCy);
              var magnetRadius = Math.max(dRect.width, tRect.width) * 0.95;
              var touched = self.hitTest(target, 1) || dist <= magnetRadius;
              if (touched && dist < bestDist) {
                bestDist = dist;
                bestTarget = target;
              }
            });
            var snapped = false;
            if (bestTarget) {
              bestTarget.classList.add('occupied');
              window.gsap.killTweensOf(dragger);
              window.gsap.to(dragger, { duration: 0.26, ease: 'power2.out', left: bestTarget.style.left, top: bestTarget.style.top, x: 0, y: 0, overwrite: 'auto' });
              if (dragger.targetAttachedTo && dragger.targetAttachedTo !== bestTarget) {
                dragger.targetAttachedTo.classList.remove('occupied');
              }
              dragger.targetAttachedTo = bestTarget;
              dragger.dataset.placedTarget = bestTarget.dataset.logicalTarget || '';
              snapped = true;
            }
            if (!snapped) {
              if (dragger.targetAttachedTo) {
                dragger.targetAttachedTo.classList.remove('occupied');
                dragger.targetAttachedTo = null;
              }
              dragger.dataset.placedTarget = '';
              window.gsap.to(dragger, { duration: 0.35, x: 0, y: 0, left: dragger.originalLeft, top: dragger.originalTop, overwrite: 'auto' });
            }
          }
        });
      };

      var ddImg = dd.querySelector('img');
      if (ddImg && !ddImg.complete) {
        ddImg.addEventListener('load', setupDraggable, { once: true });
      } else {
        setupDraggable();
      }
    }

    function showQuestion(idx) {
      if (idx < 0 || idx >= sessionItems.length) return;
      currentIdx = idx;
      byId('summaryState').classList.add('hidden');
      byId('quizContainer').classList.remove('hidden');
      byId('exam-actions').classList.remove('hidden');
      byId('progress-group').classList.remove('hidden');

      var allEls = byId('quizContainer').querySelectorAll('.questionS3');
      allEls.forEach(function (el, i) {
        el.classList.toggle('hidden', i !== idx);
      });

      var total = sessionItems.length;
      var pct = Math.round(((idx + 1) / total) * 100);
      byId('soruNumarasiS3').textContent = T.qOf.replace('{i}', String(idx + 1)).replace('{n}', String(total));
      byId('progress-fill').style.width = pct + '%';
      byId('progress-percent').textContent = pct + '%';

      byId('prevBtn').disabled = idx === 0;
      byId('nextBtn').textContent = (idx === total - 1) ? T.finish : T.next;

      examContent.scrollTop = 0;
      var activeEl = allEls[idx];
      if (activeEl) {
        requestAnimationFrame(function () {
          fitImageChoices(activeEl);
          fitDragDrop(activeEl);
        });
      }
    }

    function showSummary() {
      var allEls = byId('quizContainer').querySelectorAll('.questionS3');
      sessionItems.forEach(function (it, i) {
        if (!it.checked && allEls[i]) {
          revealFeedbackOnQuestion(it, allEls[i]);
        }
      });

      byId('quizContainer').classList.add('hidden');
      byId('exam-actions').classList.add('hidden');
      byId('summaryState').classList.remove('hidden');

      var total = sessionItems.length;
      var correctItems = sessionItems.filter(function (it) { return it.isCorrect; });
      var wrongItems = sessionItems.filter(function (it) { return !it.isCorrect; });

      byId('summaryBadge').textContent = T.sumBadge;
      byId('summaryTitle').textContent = T.sumTitle.replace('{c}', String(correctItems.length)).replace('{n}', String(total));
      byId('summaryDesc').textContent = T.sumDesc;

      var grid = byId('summaryGrid');
      grid.innerHTML = '';
      sessionItems.forEach(function (it, i) {
        var cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'sum-cell ' + (it.isCorrect ? 'ok' : 'bad');
        cell.textContent = String(i + 1);
        cell.onclick = function () { showQuestion(i); };
        grid.appendChild(cell);
      });

      var retryBtn = byId('retryWrongBtn');
      if (wrongItems.length > 0) {
        retryBtn.classList.remove('hidden');
        retryBtn.textContent = T.retryWrong.replace('{w}', String(wrongItems.length));
        retryBtn.onclick = function () {
          renderSessionQuestions(wrongItems);
        };
      } else {
        retryBtn.classList.add('hidden');
      }

      var clearBtn = byId('removeCorrectBtn');
      var unremovedCorrect = correctItems.filter(function (it) { return !it.removedFromDb; });
      if (unremovedCorrect.length > 0) {
        clearBtn.classList.remove('hidden');
        clearBtn.disabled = false;
        clearBtn.textContent = T.clearCorrect.replace('{c}', String(unremovedCorrect.length));
        clearBtn.onclick = async function () {
          clearBtn.disabled = true;
          var ids = unremovedCorrect.map(function (it) { return it.dbId; }).filter(Boolean);
          if (ids.length > 0) {
            await sb.from('user_saved_questions').delete().in('id', ids).eq('user_id', currentUser.id);
            unremovedCorrect.forEach(function (it) { it.removedFromDb = true; });
            notifyOpener();
          }
          clearBtn.textContent = T.clearedDone;
        };
      } else {
        clearBtn.classList.add('hidden');
      }
    }

    byId('prevBtn').onclick = function () {
      if (currentIdx > 0) showQuestion(currentIdx - 1);
    };
    byId('nextBtn').onclick = function () {
      if (currentIdx < sessionItems.length - 1) showQuestion(currentIdx + 1);
      else showSummary();
    };

    async function bootstrap() {
      var sessionRes = await sb.auth.getSession();
      if (!sessionRes.data || !sessionRes.data.session || !sessionRes.data.session.user) {
        window.location.replace(homeHref + '?reason=login');
        return;
      }
      currentUser = sessionRes.data.session.user;

      var accessRes = await sb.from('user_access').select('group_id').eq('user_id', currentUser.id);
      var groups = Array.isArray(accessRes.data) ? accessRes.data.map(function (r) { return r.group_id; }) : [];
      if (groups.indexOf('tests') < 0 && groups.indexOf('all') < 0) {
        window.location.replace(homeHref + '?reason=plan');
        return;
      }

      var savedRes = await sb
        .from('user_saved_questions')
        .select('id,content_test,file_type,question_numara,source_test')
        .eq('user_id', currentUser.id)
        .eq('language', lang)
        .order('created_at', { ascending: false });

      var rows = Array.isArray(savedRes.data) ? savedRes.data : [];
      if (rows.length === 0) {
        byId('loadingState').classList.add('hidden');
        byId('emptyState').classList.remove('hidden');
        return;
      }

      // Fetch only the distinct bank JSON files referenced by saved pointers
      var bankKeys = Array.from(new Set(rows.map(function (r) { return r.content_test + ':' + r.file_type; })));
      var bankMap = new Map();
      await Promise.all(bankKeys.map(async function (bk) {
        var parts = bk.split(':');
        var ct = Number(parts[0]);
        var ft = parts[1];
        try {
          var data = await fetch(buildBankUrl(ct, ft)).then(function (r) { return r.json(); });
          var byNum = new Map();
          (data.sorular || []).forEach(function (q) {
            var qCopy = Object.assign({}, q);
            if (ft === 'radio') qCopy.type = 'radio';
            else if (ft === 'checkbox') qCopy.type = 'checkbox';
            else if (ft === 'resimsech') qCopy.type = 'image';
            else if (ft === 'dragdrop') qCopy.type = 'dragdrop';
            else if (ft === 'fillblank') qCopy.onlyNumbers = true;
            byNum.set(Number(q.numara), qCopy);
          });
          bankMap.set(bk, byNum);
        } catch (e) {
          console.warn('Bank fetch failed for', bk, e);
        }
      }));

      fullPool = [];
      rows.forEach(function (r) {
        var m = bankMap.get(r.content_test + ':' + r.file_type);
        var q = m ? m.get(Number(r.question_numara)) : null;
        if (q) {
          fullPool.push({
            dbId: r.id,
            contentTest: r.content_test,
            fileType: r.file_type,
            numara: r.question_numara,
            sourceTest: r.source_test,
            removedFromDb: false,
            q: q
          });
        }
      });

      if (fullPool.length === 0) {
        byId('loadingState').classList.add('hidden');
        byId('emptyState').classList.remove('hidden');
        return;
      }

      byId('loadingState').classList.add('hidden');
      byId('chooserBadge').textContent = '⭐ ' + fullPool.length;
      byId('chooserTitle').textContent = T.chooseT;
      byId('chooserDesc').textContent = T.chooseD.replace('{n}', String(fullPool.length));
      byId('startAllBtn').textContent = T.startAll.replace('{n}', String(fullPool.length));
      byId('startAllBtn').onclick = function () {
        requestAppFullscreen();
        renderSessionQuestions(fullPool);
      };
      if (fullPool.length > 15) {
        byId('start15Btn').classList.remove('hidden');
        byId('start15Btn').textContent = T.start15;
        byId('start15Btn').onclick = function () {
          requestAppFullscreen();
          renderSessionQuestions(shuffleCopy(fullPool).slice(0, 15));
        };
      } else {
        byId('start15Btn').classList.add('hidden');
      }
      byId('chooserState').classList.remove('hidden');
    }

    bootstrap().catch(function (e) {
      console.error('Saved practice bootstrap error:', e);
      byId('loadingState').classList.add('hidden');
      byId('emptyState').classList.remove('hidden');
    });
  })();
  </script>
  <script src="/tts-core.js?v=20261128d" defer></script>
  <script src="/exam-tts.js?v=20261128d" defer></script>
</body>
